<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            paper: 'var(--paper)',
            'paper-2': 'var(--paper-2)',
            ink: 'var(--ink)',
            muted: 'var(--muted)',
            rule: 'var(--rule)',
            accent: 'var(--accent)',
            'code-kw': 'var(--code-kw)',
            'code-type': 'var(--code-type)',
            'code-str': 'var(--code-str)',
            'code-method': 'var(--code-method)'
          }
        }
      }
    };
  </script>
  <script>
    (function () {
      try {
        // Default to light theme; only use dark if the user explicitly chose it.
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F6F3EE;
      --paper-2: #EFEBE3;
      --ink: #1B1B1B;
      --muted: #6B655C;
      --rule: rgba(27, 27, 27, 0.14);
      --rule-2: rgba(27, 27, 27, 0.30);
      --accent: #B73D0A;
      --code-kw: #7C3A9E;
      --code-type: #8F5A06;
      --code-str: #44700D;
      --code-method: #1D5FA8;
    }

    .dark {
      --paper: #141210;
      --paper-2: #1D1A16;
      --ink: #EDE8DF;
      --muted: #A39B8E;
      --rule: rgba(237, 232, 223, 0.16);
      --rule-2: rgba(237, 232, 223, 0.32);
      --accent: #F08A5D;
      --code-kw: #C4A1F0;
      --code-type: #E8B64C;
      --code-str: #8FC773;
      --code-method: #7FB2F0;
    }

    html { color-scheme: light; }
    html.dark { color-scheme: dark; }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--rule-2); }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
