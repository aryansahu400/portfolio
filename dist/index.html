  <script>
    (function () {
      try {
        // Default to light theme; only use dark if the user explicitly chose it.
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}

  <style>
    :root {
      --bg: #ffffff;
      --accent: #2563eb;
      --accent-dim: rgba(37, 99, 235, 0.10);
      --border: rgba(15, 23, 42, 0.08);
    }

    body {
      background-color: var(--bg);
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    .glass {
      background: rgba(15, 23, 42, 0.02);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
    }

    .dark {
      --bg: #0a0a0a;
      --accent: #60a5fa;
      --accent-dim: rgba(96, 165, 250, 0.12);
      --border: rgba(255, 255, 255, 0.08);
    }

    .dark body { color: #f1f5f9; }

    .dark .glass { background: rgba(255, 255, 255, 0.04); }

    .dark ::-webkit-scrollbar-track { background: #18181b; }
    .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes blink {
      50% { opacity: 0; }
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
      color: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .typing-cursor::after { animation: none; }
    }
  </style>
